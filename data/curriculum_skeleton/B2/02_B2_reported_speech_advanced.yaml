topic_id: B2_reported_speech_advanced
title: "Câu tường thuật nâng cao"
cefr_level: B2
skill_type: grammar

prerequisites:
  - B1_reported_speech_basics

objectives:
  - "Dùng đa dạng động từ tường thuật (claim, suggest, warn, admit, deny, accuse...)"
  - "Tường thuật ý kiến, lời khuyên, cảnh báo với cấu trúc động từ phù hợp"
  - "Tóm tắt cuộc họp/email bằng reported speech tự nhiên"

common_errors:
  - wrong: "He suggested me to take a break"
    correct: "He suggested that I take a break / He suggested taking a break"
    hint: "'suggest' KHÔNG đi với 'suggest someone to do'. Dùng 'suggest that + S + V' hoặc 'suggest + V-ing'"

  - wrong: "She admitted to make a mistake"
    correct: "She admitted making a mistake / She admitted that she had made a mistake"
    hint: "Sau 'admit' dùng V-ing hoặc 'that-clause', không dùng to V"

  - wrong: "He accused me to steal the file"
    correct: "He accused me of stealing the file"
    hint: "Cấu trúc cố định: 'accuse someone OF + V-ing'"

  - wrong: "The CEO warned us don't share the information"
    correct: "The CEO warned us not to share the information"
    hint: "Cấu trúc: 'warn someone NOT TO + V'. Phủ định bằng 'not to', không bằng 'don't'"

  - wrong: "She insisted to pay the bill"
    correct: "She insisted on paying the bill"
    hint: "'insist ON + V-ing' — luôn đi với 'on', không đi với 'to V'"

mastery:
  min_exercises: 6
  accuracy_threshold: 0.80

recommended_vocab:
  - feedback
  - stakeholder
  - meeting
  - negotiate

exercise_types:
  - fill_in_blank
  - error_correction
  - sentence_production
